name: Prebuild (Bare)
on:
  workflow_dispatch:
  push:

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
          - os: ubuntu-22.04
            platform: android
            arch: x64
            rust_target: x86_64-linux-android
          - os: ubuntu-22.04
            platform: android
            arch: arm64
            rust_target: aarch64-linux-android
          - os: ubuntu-22.04
            platform: android
            arch: arm
            rust_target: armv7-linux-androideabi
          - os: macos-14
            platform: darwin
            arch: x64
            rust_target: x86_64-apple-darwin
          - os: macos-14
            platform: darwin
            arch: arm64
            rust_target: aarch64-apple-darwin
          - os: macos-14
            platform: ios
            arch: arm64
            rust_target: aarch64-apple-ios
          - os: macos-14
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
            rust_target: aarch64-apple-ios
          - os: macos-14
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
            rust_target: x86_64-apple-ios
          - os: windows-2022
            platform: win32
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - os: windows-2022
            platform: win32
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0
      - run: npm install -g bare-runtime bare-make
      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}
      - name: Setup Android NDK
        if: startsWith(matrix.platform, 'android')
        run: |
          # Android NDK is pre-installed on GitHub runners at /usr/local/lib/android/sdk/ndk/
          # Find the latest NDK version
          NDK_VERSION=$(ls /usr/local/lib/android/sdk/ndk/ | sort -V | tail -n1)
          NDK_ROOT="/usr/local/lib/android/sdk/ndk/${NDK_VERSION}"
          echo "NDK_ROOT=${NDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${NDK_ROOT}" >> $GITHUB_ENV
          
          # Set up toolchain paths for Rust
          case "${{ matrix.arch }}" in
            "x64") 
              ANDROID_TARGET="x86_64-linux-android"
              CC_TARGET="x86_64-linux-android29-clang"
              ;;
            "arm64")
              ANDROID_TARGET="aarch64-linux-android"
              CC_TARGET="aarch64-linux-android29-clang"
              ;;
            "arm")
              ANDROID_TARGET="armv7-linux-androideabi" 
              CC_TARGET="armv7a-linux-androideabi29-clang"
              ;;
          esac
          
          # Set environment variables for Rust cross-compilation
          echo "CC_${ANDROID_TARGET//-/_}=${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/${CC_TARGET}" >> $GITHUB_ENV
          echo "CXX_${ANDROID_TARGET//-/_}=${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/${CC_TARGET}++" >> $GITHUB_ENV
          echo "AR_${ANDROID_TARGET//-/_}=${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_${ANDROID_TARGET^^//-/_}_LINKER=${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/${CC_TARGET}" >> $GITHUB_ENV
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate build files
        run: bare-make generate --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ matrix.flags }}
      - name: Build
        run: bare-make build
      - name: Install prebuilds
        run: bare-make install
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
          path: prebuilds/*
  merge:
    runs-on: ubuntu-latest
    needs: prebuild
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: prebuilds
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-bare
          path: prebuilds
